[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "globlint"
version = "0.1.0"
description = "A validating parser and pretty printer for glob patterns, with precise line/column error messages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "miles-bits" }]

[tool.setuptools.packages.find]
include = ["globlint*"]
